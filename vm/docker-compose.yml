name: ezomar-vm

# Omarchy numa VM, para ensaiar este repo antes de formatar a máquina de verdade.
#
# O motor é o qemux/qemu (QEMU/KVM dentro de um container), o mesmo esquema do
# dockurr/windows. A GUI sai no browser, então não é preciso cliente de VNC nem
# libvirt na máquina host. Herdado do ezarch (vm/docker-compose.yml), com três
# mudanças: ISO local em vez de download, portas próprias para conviver com
# outra VM já de pé, e sem restart automático.
#
# Suba pelo wrapper, que resolve o ISO e confere as portas:
#
#   bash vm/up.sh
#
# O ISO é montado em /boot.iso, e nesse caso o qemux ignora a variável BOOT.
# UEFI é o padrão dele, que é como a máquina real vai bootar.
services:
  omarchy:
    image: qemux/qemu
    container_name: ${EZOMAR_VM_NAME:-ezomar-vm}
    environment:
      RAM_SIZE: "${EZOMAR_VM_RAM:-8G}"
      CPU_CORES: "${EZOMAR_VM_CPUS:-6}"
      DISK_SIZE: "${EZOMAR_VM_DISK:-64G}"
      # Sem isto o guest cai no llvmpipe, e o Hyprland renderizando por software
      # produz artefatos de redraw: retângulos pretos e regiões que nunca são
      # repintadas, além da lentidão. O up.sh liga quando o host tem /dev/dri.
      GPU: "${EZOMAR_VM_GPU:-N}"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "${EZOMAR_VM_WEB_PORT:-8007}:8006"            # viewer web (noVNC)
      - "127.0.0.1:${EZOMAR_VM_VNC_PORT:-5901}:5900"  # VNC direto, se preferir Remmina
      - "127.0.0.1:${EZOMAR_VM_SSH_PORT:-2223}:22"    # ssh para o guest, usado pelo vm-test.sh
    volumes:
      # Sem :ro de propósito: desde o QEMU 11 o qemux liga o ISO como pendrive
      # USB (usb-storage), que abre o arquivo para escrita e morre com
      # "Read-only file system" se o bind for somente leitura (24/10/2026).
      - "${EZOMAR_VM_ISO:?defina EZOMAR_VM_ISO ou use vm/up.sh}:/boot.iso"
      - "${EZOMAR_VM_STORAGE:-./storage}:/storage"
    # Sem restart automático de propósito. A VM anterior desta máquina ficou
    # dois dias de pé segurando 8G e as portas, parada no instalador, porque
    # subia sozinha a cada boot. Um ensaio é transitório; suba quando for usar.
    restart: "no"
    stop_grace_period: 2m

# Sub-rede fixa e fora do que a tailnet anuncia. A tailnet da Exato publica
# rotas para 172.16/172.20/172.21/172.22/172.30, e o Tailscale consulta essas
# rotas (tabela 52) antes da tabela main. Com a sub-rede automática do Docker
# (172.21.0.0/16 em 24/10/2026), tudo que ia do host para a VM, e da VM para a
# internet, entrava no túnel e sumia: viewer mudo, ssh recusado, VM sem rede.
# Tem de ficar dentro de 172.16.0.0/12: é a faixa que o ufw do Omarchy deixa
# falar com o DNS dos containers (systemd-resolved em 172.17.0.1).
networks:
  default:
    ipam:
      config:
        - subnet: "${EZOMAR_VM_SUBNET:-172.31.237.0/24}"

