# Arm the hardware watchdog while the system is running, not only at shutdown.
# Installed by ezomar: install/apps/82-watchdog.sh
#
# systemd pings /dev/watchdog every RuntimeWatchdogSec/2. If PID 1 stops being
# scheduled (a total hard lockup), the chipset timer expires and resets the box.
#
# 60s. The primary machine started at 120s out of fear of rebooting a box that
# was merely thrashing. Evidence killed that fear twice: a lockup on 2026-08-06
# was power-cycled by hand 46 seconds before a 120s timer would have acted, and
# on 2026-08-20 swap sat at 0 bytes free for hours with not one journal gap,
# meaning PID 1 kept petting the watchdog throughout. Memory pressure lives in
# userspace; it does not stop systemd. A timeout longer than the operator's
# patience never fires.
#
# RebootWatchdogSec is left at its 10min default: that one guards the shutdown
# path and is already correct.
[Manager]
RuntimeWatchdogSec=60
