# Backup do home com borgmatic, para dois repositórios.
#
# Hetzner é o offsite; o ZEUS é a cópia local, que é a que você usa quando o que
# aconteceu foi apagar uma pasta sem querer, e não a casa pegar fogo. O mesmo
# conjunto de arquivos vai para os dois, com a mesma chave.
#
# A passphrase sai do 1Password em tempo de execução (`borg-passphrase`), porque
# este arquivo vive no chezmoi e chezmoi vive num repositório.

source_directories:
  - /home/opik

repositories:
  - path: ssh://u548875@u548875.your-storagebox.de:23/./backups/takidesk-home
    label: hetzner
  - path: /mnt/zeus-backup/backups/borg/takidesk-home
    label: zeus

encryption_passcommand: /home/opik/.local/bin/borg-passphrase

# As opções do ssh vieram de uma falha de verdade, em 30/09/2026: a internet
# oscilou entre 03:28 e 03:37, o Hetzner falhou às 03:33 e o log disse "Network
# is unreachable".
#
# Essa mensagem enganava. O nome resolve para IPv4 e IPv6, esta máquina não tem
# rota IPv6, e o ssh reporta só o erro do ÚLTIMO endereço que tentou. O IPv4
# caiu primeiro por causa da queda, depois o IPv6 recusou na hora, e sobrou no
# log o motivo do IPv6. `AddressFamily=inet` faz o erro que aparece ser o do
# endereço que de fato importa.
#
# ConnectTimeout: sem ele a conexão levou 4 minutos para desistir, tempo que a
# retentativa abaixo usa melhor. ServerAlive: uma queda no meio do envio é
# detectada em uns 3 minutos, em vez de ficar pendurada até o TCP desistir.
ssh_command: ssh -i /home/opik/.ssh/hetzner-storagebox -o BatchMode=yes -o AddressFamily=inet -o ConnectTimeout=30 -o ServerAliveInterval=60

# Queda de rede de madrugada acontece, e sem retentativa uma oscilação de dez
# minutos custa o offsite do dia inteiro. A espera cresce a cada tentativa (5,
# 10 e 15 minutos), então três tentativas cobrem meia hora de rede instável. Só
# o repositório que falhou é repetido: o ZEUS não roda de novo por causa do
# Hetzner.
retries: 3
retry_wait: 300

# zstd em nível baixo: o gargalo aqui é a rede e o disco do NAS, não a CPU, e o
# ganho de comprimir mais que isto não paga o tempo.
compression: zstd,3
one_file_system: true

# Marca de diretório de cache (CACHEDIR.TAG). É o que apaga os `target/` do
# cargo sem precisar listar cada um: o próprio cargo escreve a marca lá dentro.
exclude_caches: true
exclude_if_present:
  - .nobackup

exclude_patterns:
  # Os mounts. Sem isto o backup tenta engolir os 27 TB do NAS e o espelho do
  # kage, passando por si mesmo no caminho.
  - /home/opik/mnt
  - /home/opik/.cache
  - /home/opik/.local/share/Trash
  - /home/opik/.local/share/containers
  # Dependência baixada é coisa que o gerenciador refaz. Medido aqui: .venv
  # sozinho tinha 52 GB, e nada disso é trabalho seu.
  - '**/.venv'
  - '**/venv'
  - '**/node_modules'
  - '**/__pycache__'
  - '**/.pytest_cache'
  - '**/.mypy_cache'
  - '**/.ruff_cache'
  - /home/opik/.rustup
  - /home/opik/.cargo/registry
  - /home/opik/.nuget/packages
  - /home/opik/.npm
  - /home/opik/go/pkg
  # Runtime e pacote baixado, que um comando refaz: `mise install` e o primeiro
  # `dotnet restore`. Sao 7,4 GB e nenhum byte deles e trabalho de ninguem.
  - /home/opik/.local/share/mise
  - /home/opik/.local/share/NuGet
  # Clones de repositorio dos outros. Medido em 09/09/2026: dos 42 ali, 38 estavam
  # identicos ao remoto. O que se perde ao excluir e um `git clone`, e o que se
  # ganha sao 20 GB e 206 mil arquivos em toda execucao.
  #
  # O que ISTO nao cobre: alteracao local. Quatro repos tinham trabalho so ali
  # (react-doctor, ServiceStack, tweakcc sujos; omarchy com commit nao enviado).
  # Se voltar a existir trabalho local em algum, commite: aqui ele nao viaja.
  - /home/opik/work/repos/references
  # Saida de build do .NET. O segmento Debug/Release e o que torna isto seguro:
  # exclui `bin/Debug` sem tocar num `bin/` qualquer que tenha script de verdade.
  - '**/bin/Debug'
  - '**/bin/Release'
  - '**/obj/Debug'
  - '**/obj/Release'
  # Sockets e arquivos vivos: o borg avisa que não conseguiu ler e polui o log
  # com falha que não é falha.
  - /home/opik/.local/share/herdr/*.sock

# `dist`, `build` e os `bin/` genéricos continuam DENTRO de propósito: esses
# nomes, sozinhos, aparecem em repositório onde guardam conteúdo de verdade, e o
# dia da restauração é o pior lugar para descobrir a exclusão errada. O que saiu
# acima foi só a saída do .NET, que se identifica pelo segmento Debug/Release:
# medido aqui, 1,1 GB em `bin/Debug` espalhados por 73 projetos.

keep_daily: 7
keep_weekly: 4
keep_monthly: 6

# Verificação completa é cara: lê o repositório inteiro. De duas em duas semanas
# pega corrupção silenciosa antes de ela virar a única cópia.
checks:
  - name: repository
    frequency: 2 weeks
  - name: archives
    frequency: 4 weeks
