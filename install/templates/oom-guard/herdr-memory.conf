# Contain the agent fleet so it cannot starve the rest of the machine.
# Installed by ezomar: install/apps/80-oom-guard.sh (values sized from RAM)
#
# Every herdr pane, and therefore every Claude Code session it hosts, lives under
# this one user unit. That makes it the only place the fleet can be bounded as a
# group, and also its weak spot: Omarchy arms systemd-oomd with
# ManagedOOMMemoryPressure=kill on app.slice, and oomd kills whole cgroups. One
# pressure event could take every pane at once.
#
# MemoryHigh starts gentle reclaim inside the cgroup; most spikes end there.
# MemoryMax gives the fleet its own OOM domain: at the ceiling the kernel kills
# the fattest process INSIDE this cgroup, a claude pane, which herdr resumes by
# session uuid. Nothing outside notices. Measured on the primary machine: 97
# claude processes sat at 69.6G, 52.1G of it anonymous, so High/Max of 64G/72G
# on 128G is where the fleet actually lives, not a guess.
#
# ManagedOOMPreference=avoid asks oomd to pick anything else first, so the
# kernel's per-process kill inside the cgroup happens before oomd's per-cgroup
# one. Note the kernel OOM killer gives no SIGTERM grace: a pane dies abruptly.
# Accepted price for never losing the desktop to the fleet's appetite.
[Service]
MemoryAccounting=yes
MemoryHigh=@HIGH@
MemoryMax=@MAX@
ManagedOOMPreference=avoid
