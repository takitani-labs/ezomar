# Escape hatches for memory exhaustion.
# Installed by ezomar: install/apps/80-oom-guard.sh
#
# Omarchy already ships the reclaim tuning (vm.watermark_scale_factor,
# vm.page-cluster, vm.swappiness) in /etc/sysctl.d/99-omarchy-sysctl.conf, so
# this drop-in carries only the two things it lacks.

# Arch ships kernel.sysrq=16, which enables sync only. That leaves Alt+SysRq+F
# (force one OOM kill), the one manual exit from a reclaim spiral, disabled
# exactly when it is needed. 1 enables every SysRq function, REISUB included.
kernel.sysrq=1

# Enough for root to still fork a shell and kill something by hand while
# userspace is starving. The 8M default is not enough to log in and act.
vm.admin_reserve_kbytes=262144
