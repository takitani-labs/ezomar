# Keep the desktop resident so you can still act during memory pressure.
# Installed by ezomar: install/apps/80-oom-guard.sh
#
# session.slice holds the compositor (Hyprland under uwsm), the bar and the
# session bus. Omarchy protects them from systemd-oomd *kills*, not from
# *reclaim*, and reclaim is what freezes a compositor: measured on the primary
# machine, the UI stopped answering input long before anything was killed.
#
# MemoryMin is a reclaim guarantee, not a reservation: memory below this floor
# is protected from reclaim but not taken away from anyone. The systemd default
# is 250M, against a measured ~6.7G working set.
[Slice]
MemoryAccounting=yes
MemoryMin=4G
