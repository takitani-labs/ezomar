# Volume por software em DACs que mentem a escala de decibéis.
#
# O Fuxi-H3 (XiiSound) declara 100 passos de volume no controle PCM e uma faixa
# total de 0,39 dB: o aparelho afirma que seu controle inteiro varia menos de
# meio decibel. O PipeWire trabalha em dB, então ao pedir -1,34 dB para 95% não
# acha nada nessa faixa e escreve o passo mínimo, que é 0%.
#
# Medido no takidesk com o fone tocando, amostrando o ALSA a cada segundo:
#
#   PipeWire 100%  ->  PCM,0  Front Left 100%  Front Right 100%   estéreo
#   PipeWire  95%  ->  PCM,0  Front Left   0%  Front Right   0%   morreu
#   PipeWire  90%  ->  PCM,0  Front Left   0%  Front Right   0%
#   em todos:          PCM,1  Mono       100%
#
# Some o caminho estéreo e sobra só o controle mono, e é por isso que o sintoma
# na orelha é "ficou mono de um lado só" em vez de "ficou mudo".
#
# api.alsa.soft-mixer desliga o uso do mixer do hardware: o PipeWire atenua por
# software e deixa o controle PCM parado onde estiver. O preço é atenuar em
# software (irrelevante em 24 bits) e a exigência de manter o PCM alto no ALSA,
# que o módulo faz e o alsactl persiste.
#
# O CASAMENTO É PELO DEVICE, NÃO PELO NODE. A versão anterior desta regra usava
# node.name, e o efeito era enganoso: a propriedade aparecia no node em
# `pw-dump` e não mudava nada, porque api.alsa.soft-mixer é opção de card lida
# pelo ACP na criação do device. Em alsa.lua o WirePlumber aplica estas regras
# três vezes, e a que vale para o card é a da linha 575, sobre as propriedades
# do device, imediatamente antes de SpaDevice(factory, properties).
#
# Não é defeito do Omarchy nem do PipeWire: é o descritor do aparelho. Qualquer
# distro faz o mesmo, e o lugar certo de corrigir de vez seria um quirk no
# kernel ou na base do WirePlumber.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*XiiSound.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
